version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: '@modelcontextprotocol/ext-apps'
        update-types: ['version-update:semver-major']
      - dependency-name: '@modelcontextprotocol/sdk'
        update-types: ['version-update:semver-major']
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 14
    labels:
      - 'dependencies'
      - 'github-actions'
